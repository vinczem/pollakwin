name: Docker Build & Publish to github packages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated test services
        run: docker compose -p pollakwin-test -f tests/compose.yml up -d --build --wait
      - name: Check PHP syntax
        run: docker compose -p pollakwin-test -f tests/compose.yml exec -T web sh -c 'find /var/www/html -name "*.php" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 php -l'
      - name: Test registration, feedback, drawing and schedule
        run: docker compose -p pollakwin-test -f tests/compose.yml exec -T web php tests/postgres.php
      - name: Show logs on failure
        if: failure()
        run: docker compose -p pollakwin-test -f tests/compose.yml logs
      - name: Clean up
        if: always()
        run: docker compose -p pollakwin-test -f tests/compose.yml down -v

  build:
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    name: Build Docker Image 🏗️
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code 🛎️
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx 🚀
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry 🚢
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push 🏗️
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

