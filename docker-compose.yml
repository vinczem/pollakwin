services:
  web:
    image: ${POLLAKWIN_IMAGE:-ghcr.io/vinczem/pollakwin:latest}
    build:
      context: .
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pollakrendezvenyek
      - DB_USER=${DB_USER:-pollakwin}
      - DB_PASS=${DB_PASS:?Set DB_PASS in .env}
      - PRODUCTION=false
      - SITE_URL=http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=${DB_USER:-pollakwin}
      - POSTGRES_PASSWORD=${DB_PASS:?Set DB_PASS in .env}
      - POSTGRES_DB=pollakrendezvenyek
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./create_users_table.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
